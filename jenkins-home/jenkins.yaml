jenkins:
  systemMessage: "PESCE Intelligence CI/CD — Auto-configured"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 2

  # ── Security: local accounts ──────────────────────────────
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"   # Change after first login

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  # ── Global tool installations ─────────────────────────────
tool:
  git:
    installations:
      - name: "Default"
        home: "git"
  nodejs:
    installations:
      - name: "Node 20"
        home: ""
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "20.18.0"
                    npmPackagesRefreshHours: 72

# ── Pipeline Job Definition ───────────────────────────────────
jobs:
  - script: |
      pipelineJob('PESCE-Intelligence-Pipeline') {
        description('CI/CD Pipeline for PESCE Intelligence PWA + Backend')
        
        definition {
          cpsScm {
            scm {
              filesystem {
                path('d:/games/PES placement PWA')
                filter {
                  includeRegion('Jenkinsfile')
                }
              }
            }
            scriptPath('Jenkinsfile')
          }
        }

        triggers {
          // Poll SCM every 5 minutes (replace with webhook when using Git remote)
          scm('H/5 * * * *')
        }

        properties {
          buildDiscarder {
            strategy {
              logRotator {
                numToKeepStr('10')
                artifactNumToKeepStr('5')
              }
            }
          }
          disableConcurrentBuilds()
        }
      }
