# ─────────────────────────────────────────────────────────────
# PESCE Intelligence — Docker Compose Dev Overrides
# Applied automatically when running: docker compose up
# ─────────────────────────────────────────────────────────────
# This file overlays docker-compose.yml for local development.
# It adds hot-reload mounts and disables the healthcheck delay.
# ─────────────────────────────────────────────────────────────

services:

  backend:
    build:
      # In dev, use --reload for auto-restart on code changes
      args:
        - BUILD_ENV=development
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8001
      --reload
      --log-level debug
    volumes:
      # Bind-mount source code for hot reload
      - ./Lango/Lango/Langraph:/app
      - output_data:/app/output
    environment:
      PYTHONDEBUG: "1"
    # Faster start for dev
    healthcheck:
      start_period: 10s

  frontend:
    # In dev, just expose extra port for debugging
    ports:
      - "3000:80"
      - "9229:9229"    # debug port
