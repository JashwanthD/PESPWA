# ─────────────────────────────────────────────────────────────
# PESCE Intelligence — Docker Compose Dev Overrides
# Applied automatically when running: docker compose up
# ─────────────────────────────────────────────────────────────
# Only overrides: command (adds --reload) and healthcheck timing.
# Does NOT add bind mounts (they would shadow pip-installed packages).
# ─────────────────────────────────────────────────────────────

services:

  backend:
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
      - --log-level
      - debug
    healthcheck:
      start_period: 10s

  frontend:
    # Extra debug port in dev
    ports:
      - "3000:80"
